services:
  api:
    environment:
      ENVIRONMENT: production
      PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql+asyncpg://image:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting production}@postgres:5432/image_lms
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS before starting production}
    volumes: !reset []
    ports: !reset
      - "127.0.0.1:8000:8000"
  frontend:
    ports: !reset
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: production
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting production}
    ports: !reset []
  redis:
    ports: !reset []
